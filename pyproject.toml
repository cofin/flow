[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow"
version = "0.28.1"
description = "Unified toolkit for Spec-Driven Development"
authors = [
  { name = "cofin" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flow-catalog = "tools.catalog.cli:main"

[dependency-groups]
dev = [
  { include-group = "catalog" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "build" },
]
catalog = [
  "fastembed>=0.6.0",
  "msgspec>=0.19.0",
  "sqlspec[duckdb,msgspec]>=0.38.0",
]
lint = [
  "mypy>=1.11",
  "pyright>=1.1.380",
  "ruff>=0.7",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
build = [
  "bump-my-version>=0.28",
]

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.28.1"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    ((?P<pre>a|b|rc)(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}{pre}{pre_n}", "{major}.{minor}.{patch}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["a", "b", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = "plugin.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = ".claude-plugin/plugin.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = ".claude-plugin/marketplace.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = ".codex-plugin/plugin.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = ".cursor-plugin/plugin.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = ".agents/plugins/marketplace.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = "vscode-extension/package.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
pythonVersion = "3.11"
include = ["tools", "tests"]

schema_version: 1

git_policy:
  tags: forbidden
  allowed_local_operations: [notes, branches, worktrees]

state_operations:
  - create
  - activate
  - claim
  - release
  - note
  - discover
  - block
  - unblock
  - checkpoint
  - close
  - skip
  - reopen
  - revise
  - reconcile
  - complete
  - archive
  - recover
  - status

shared_contracts:
  - {id: flow-state-v1, source: skills/flow/references/state.md, runtime_dependency: agent_file_tools_only}
  - {id: structured-choice-v1, source: skills/flow/references/interaction.md, runtime_dependency: agent_file_tools_only}
  - {id: worksheet-execution-v1, source: skills/flow/references/implement.md, runtime_dependency: agent_file_tools_only}

interaction_contracts:
  structured-choice-v1:
    procedure_source: skills/flow/references/interaction.md
    request:
      exact_keys: [contract_id, decision_id, selection_mode, question, disabled_choice_policy, choices, recommended_choice_id, allow_custom, min_selections, max_selections, free_form_reason, input_guidance]
      exact_choice_keys: [id, label, description]
      variants:
        binary: {choice_count: [2, 2], recommendation: first_choice, allow_custom: true, bounds: forbidden}
        single_select: {choice_count: [2, 4], recommendation: first_choice, allow_custom: true, bounds: forbidden}
        multi_select: {choice_count: [2, 4], recommendation: first_choice, allow_custom: true, bounds: required}
        open:
          choice_count: [0, 0]
          recommendation: null
          allow_custom: false
          bounds: forbidden
          free_form_reasons: [user_defined_identifier, revision_details, other_constraint]
    result:
      exact_keys: [decision_id, selection_mode, outcome, selected_choice_ids, custom_text, open_text, transport, tool_name, fallback_reasons]
      outcomes:
        binary: [selected, custom, cancelled]
        single_select: [selected, custom, cancelled]
        multi_select: [selected, selected_with_custom, cancelled]
        open: [submitted, cancelled]
    fallback_reason_order: [tool_absent, tool_denied, mode_unsupported, choice_count_unsupported, bounds_unsupported, custom_unsupported, disabled_policy_unsupported]
    planning_gates:
      pre_quality: [revise, refine]
      post_quality: [approve, revise, refine]
    transition_effects:
      approve: [advance]
      revise: [collect_open_revision_details, apply_changes, increment_plan_identity_if_plan_bearing, revalidate, represent_gate]
      refine: [ask_next_structured_gap, update, revalidate, represent_gate]
      cancelled: [stop_without_approval_or_mutation]

harnesses:
  - id: antigravity
    transport: conditional_native
    verified_tool: ask_question
    permission_check: declared_and_allowed
    supported_modes: [binary, single_select, multi_select]
    choice_min: 2
    choice_max: 4
    mutual_exclusion: true
    multi_select: true
    bounds_enforcement: agent_validated
    custom_answer_behavior: native_custom_input
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "Antigravity allowed-tool contract for ask_question"
    command_surface: skill_derived
    plan_capability: native
  - id: claude_code
    transport: conditional_native
    verified_tool: AskUserQuestion
    permission_check: declared_and_allowed
    supported_modes: [binary, single_select, multi_select]
    choice_min: 2
    choice_max: 4
    mutual_exclusion: true
    multi_select: true
    bounds_enforcement: agent_validated
    custom_answer_behavior: native_custom_input
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "Claude Code declared AskUserQuestion contract"
    command_surface: slash_command
    plan_capability: native
  - id: codex_cli
    transport: conditional_native
    verified_tool: request_user_input
    permission_check: declared_and_allowed
    supported_modes: [binary, single_select]
    choice_min: 2
    choice_max: 3
    mutual_exclusion: true
    multi_select: false
    bounds_enforcement: unsupported
    custom_answer_behavior: native_custom_input
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "Codex request_user_input schema advertised by the active session"
    command_surface: natural_language
    plan_capability: native
  - id: opencode
    transport: conditional_native
    verified_tool: question
    permission_check: declared_and_allowed
    supported_modes: [binary, single_select, multi_select]
    choice_min: 2
    choice_max: 4
    mutual_exclusion: true
    multi_select: true
    bounds_enforcement: agent_validated
    custom_answer_behavior: native_custom_input
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "OpenCode built-in question tool documentation"
    command_surface: optional_slash_command
    plan_capability: reasoning_only
  - id: cursor
    transport: sequential_text
    verified_tool: null
    permission_check: not_applicable
    supported_modes: []
    choice_min: null
    choice_max: null
    mutual_exclusion: false
    multi_select: false
    bounds_enforcement: unsupported
    custom_answer_behavior: sequential_text_only
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "No verified Flow-native Cursor question tool"
    command_surface: natural_language
    plan_capability: reasoning_only
  - id: vscode_copilot
    transport: sequential_text
    verified_tool: null
    permission_check: not_applicable
    supported_modes: []
    choice_min: null
    choice_max: null
    mutual_exclusion: false
    multi_select: false
    bounds_enforcement: unsupported
    custom_answer_behavior: sequential_text_only
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "No verified Flow-native VS Code Copilot question tool"
    command_surface: natural_language
    plan_capability: reasoning_only
  - id: openclaw
    transport: sequential_text
    verified_tool: null
    permission_check: not_applicable
    supported_modes: []
    choice_min: null
    choice_max: null
    mutual_exclusion: false
    multi_select: false
    bounds_enforcement: unsupported
    custom_answer_behavior: sequential_text_only
    disabled_choice_policy: omit
    sequential_fallback: true
    evidence: "No verified Flow-native OpenClaw question tool"
    command_surface: natural_language
    plan_capability: none


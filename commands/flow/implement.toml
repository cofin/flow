description = "Execute tasks from plan (context-aware)"
prompt = """
## Lifecycle Skill
Use the `flow-execution` lifecycle skill through the `flow` router before carrying out this command.

## 1.0 SYSTEM DIRECTIVE
You are a delegator for the Flow framework. Your task is to transition the current request to the high-reasoning "Executor" subagent to ensure proper model routing and TDD discipline.

## 1.1 DELEGATION STRATEGY
1. **Read Configuration**: Read `use_branched_workspaces` from `.agents/config.json` (default to `false` if missing).
2. **Delegate**:
   - If `use_branched_workspaces` is `true` and the harness supports it, spawn/invoke `@executor` in a branched workspace (`Workspace='branch'`) with the user's request: `{{args}}`. The executor follows the same rules either way: TDD, notes in the task file, close with `state: closed` + commit SHA, immediate spec checklist reconciliation.
   - Otherwise, invoke `@executor` in the current workspace.

## 1.2 CONTEXT PASS-THROUGH
Ensure the subagent receives:
- The Flow ID or request: `{{args}}`
- Reference to current `.agents/bundles/specs/` state and active `spec.md`.
- Instruction to follow the TDD protocol and invoke Superpowers skills (tdd, verification-before-completion).
- Instruction to reconcile the `spec.md` checklist marker IMMEDIATELY after EVERY task state change (claim, block, skip, close) — mandatory, never deferred. Claiming reconciles the marker to `[~]`; closing reconciles it to `[x]` with the commit SHA appended (`[<sha>]`).
"""

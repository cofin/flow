description = "Sync context with codebase after external changes"
prompt = """
## Lifecycle Skill
Use the `flow-sync-status` lifecycle skill through the `flow` router before carrying out this command.

## 1.0 SYSTEM DIRECTIVE
You are an AI agent assistant for the Flow spec-driven development framework. Your task is to refresh the flow's context files by re-scanning the codebase and updating the `.agents/bundles/` metadata to reflect the current state.

CRITICAL: You must validate the success of every tool call. If any tool call fails, you MUST halt the current operation immediately, announce the failure to the user, and await further instructions.

---

## 1.1 PARSE OPTIONS
**PROTOCOL: Determine the scope of this refresh operation.**

1.  **Check Arguments:**
    *   If `{{args}}` contains `--full`, perform a deep scan including all flows (not just active ones).
    *   Otherwise, standard refresh of active flow context.

---

## 2.0 READ CURRENT CONTEXT
**PROTOCOL: Load existing context files.**

1.  Read `.agents/bundles/index.md`, `.agents/bundles/product/tech-stack.md`, `.agents/bundles/knowledge/workflow.md`, `.agents/bundles/knowledge/patterns.md`.
2.  Identify active flows by scanning `.agents/bundles/specs/*/spec.md` frontmatter for `state: active` (or `planned`).
3.  If an active flow exists, read `.agents/bundles/specs/<flow_id>/spec.md` and its task files under `tasks/*.md`.
4.  Note the spec's `updated_at` timestamp (this is the baseline for detecting changes).

---

## 3.0 SCAN CODEBASE FOR DRIFT
**PROTOCOL: Detect changes since last known state.**

1.  **Git History:** Run `git log --oneline --since="<last_updated_at>"` to identify recent commits.
2.  **New/Modified/Deleted Files:** Run `git diff --name-status <last_commit>..HEAD` to find files changed since last sync.
3.  **Dependency Changes:** Check `package.json`, `pyproject.toml`, `Cargo.toml`, `go.mod` for modifications.
4.  **Tech Stack Drift:** Compare current dependency files with `.agents/bundles/product/tech-stack.md`. Note any new frameworks, removed packages, or version changes.
5.  **Workflow Drift:** Inspect `Makefile`, `justfile`, `Taskfile.yml`, `package.json`, `pyproject.toml`, `Cargo.toml`, `.pre-commit-config.yaml`, and CI files. Compare discovered canonical commands and workflow assumptions with `.agents/bundles/knowledge/workflow.md`.

---

## 4.0 UPDATE CONTEXT FILES
**PROTOCOL: Refresh context to match codebase state.**

1.  **Tech Stack:** If dependency changes detected, update `.agents/bundles/product/tech-stack.md` with current state.
2.  **Patterns:** If new patterns detected in recent commits (e.g., new conventions, new libraries adopted), note them for pattern elevation.
3.  **Workflow:** If workflow drift is detected, explicitly prompt the user: "Workflow settings may be stale. Revalidate `.agents/bundles/knowledge/workflow.md` now?"
    *   Refresh only the affected workflow sections instead of replacing the entire file.
    *   Prefer repo-native aggregate commands such as `make lint`, `make test`, `make check`, `just check`, `task test`, package scripts, and pre-commit entrypoints.
4.  **Flow Tasks:** If the active flow's tasks were completed externally (commits reference task ids), update the affected task files: set `state: closed`, `commit: <sha>`, and refresh `updated_at`.
5.  **Index:** Refresh `.agents/bundles/index.md` if structural changes detected (new dirs, renamed files).

---

## 5.0 RECONCILE SPEC AND TASKS
**PROTOCOL: Reconcile the spec checklist with the task files.**

1.  Run the `/flow:sync` reconciliation inline: update each `spec.md` checklist marker to match its task file's `state` (`open` -> `[ ]`, `in_progress` -> `[~]`, `closed` -> `[x]` + ` [sha]`, `blocked` -> `[!]`, `skipped` -> `[-]`).
2.  The task file is authoritative on conflict.

---

## 6.0 REPORT CHANGES
**PROTOCOL: Summarize what changed.**

Print a concise summary:

```text
Flow Refresh Complete
─────────────────────
Since last sync (<timestamp>, <days> ago):
  • <N> commits by <contributors>
  • <dependency file>: <changes>
  • tech-stack.md: <updated/unchanged>
  • workflow.md: <revalidated/unchanged>
  • <flow_id>: <N> tasks updated
  • spec.md: <synced/unchanged>

<Conflicts detected: none / list>
```

---

## Critical Rules
1.  **NEVER OVERWRITE MANUAL EDITS** - Merge changes into spec.md, don't replace
2.  **ASK ON CONFLICT** - If conflicts detected, present both versions and ask user to resolve
3.  **SYNC AT END** - Reconcile the checklist so spec.md reflects final task state
4.  **LOG IN TASK FILES** - Record externally-detected changes as timestamped entries in the affected task files' `## Notes & Discoveries` sections
5.  **READ-ONLY ON CODE** - Never modify source files, only `.agents/` context
6.  **WORKFLOW DRIFT COUNTS** - Treat stale canonical commands and ignore policy as refresh work, not optional cleanup
"""

description = "Git-aware revert of flows, phases, or tasks"
prompt = """
## Lifecycle Skill
Use the `flow-completion` lifecycle skill through the `flow` router before carrying out this command.

## 1.0 SYSTEM DIRECTIVE
You are a **Git-aware revert assistant** for the Flow framework.

**Scope:** Revert logical units (Flows, Phases, Tasks) by:
1. Confirming user intent
2. Finding associated Git commits in task metadata
3. Presenting execution plan
4. Reverting commit changes and resetting metadata status

Handles non-linear Git histories (rebase, squash, merge commits).

**CRITICAL**: User confirmation required at multiple checkpoints. Halt on denial.

---

## 1.1 SETUP CHECK
**PROTOCOL: Verify environment and OKF.**

1.  **Verify Core Context:** Verify that `.agents/bundles/specs/` exists.
2.  **Handle Failure:** If missing: "Project not set up. Run `/flow:setup`." → HALT

---

## 2.0 PHASE 1: INTERACTIVE TARGET SELECTION & CONFIRMATION
**GOAL: Guide the user to clearly identify and confirm the logical unit of work they want to revert before any analysis begins.**

1.  **Initiate Revert Process:** Your first action is to determine the user's target.

2.  **Check for a User-Provided Target:** First, check if the user provided a specific target as an argument (e.g., `/flow:revert flow <flow_id>`).
    *   **IF a target is provided:** Proceed directly to the **Direct Confirmation Path (A)** below.
    *   **IF NO target is provided:** You MUST proceed to the **Guided Selection Menu Path (B)**. This is the default behavior.

3.  **Interaction Paths:**

    *   **PATH A: Direct Confirmation**
        1.  Find the specific Flow, phase, or task the user referenced in the spec and tasks folders under `.agents/bundles/specs/`.
        2.  Ask the user for confirmation: "You asked to revert the [Flow/Phase/Task]: '[Description]'. Is this correct?".
            - **Structure:**
                A) Yes
                B) No
        3.  If "yes", establish this as the `target_intent` and proceed to Phase 2. If "no", ask clarifying questions to find the correct item to revert.

    *   **PATH B: Guided Selection Menu**
        1.  **Identify Revert Candidates:** Your primary goal is to find relevant items for the user to revert.
            *   **Scan All Plans:** Scan `.agents/bundles/specs/` directories and read the `spec.md` of each bundle.
            *   **Prioritize In-Progress:** First, find **all** Flows, Phases, and Tasks marked as "in-progress" (`[~]` in specs or `in_progress` in task files).
            *   **Fallback to Completed:** If and only if NO in-progress items are found, find the **5 most recently completed** Tasks and Phases (`[x]` / `closed`).
        2.  **Present a Unified Hierarchical Menu:** Present the results to the user in a clear, numbered, hierarchical list grouped by Flow.
        3.  **Process User's Choice:**
            *   If the user selects a menu item, set this as the `target_intent` and proceed directly to Phase 2.
            *   If the user wants to specify another target, engage in a dialogue to resolve it.

4.  **Halt on Failure:** If no completed or active items are found to present as options, announce this and halt.

---

## 3.0 PHASE 2: GIT RECONCILIATION & VERIFICATION
**GOAL: Find ALL actual commit(s) in the Git history that correspond to the user's confirmed intent and analyze them.**

1.  **Identify Implementation Commits:**
    *   **IF Task Revert**: Read the YAML frontmatter of `.agents/bundles/specs/{flow_id}/tasks/{task_id}.md` to get `commit: <sha>`.
    *   **IF Phase Revert**: Parse `.agents/bundles/specs/{flow_id}/spec.md` checklist to find the task IDs in the target phase. Read their task files to get all their commit SHAs.
    *   **IF Flow Revert**: Read all task files under `.agents/bundles/specs/{flow_id}/tasks/*.md` to get all commit SHAs. If the specs folder itself was deleted, first restore it by running:
        ```bash
        python3 tools/flow_completion.py revert-delete {flow_id}
        ```
2.  **Compile and Analyze Final List:**
    *   Compile the list of SHAs to be reverted in reverse chronological order.
    *   For each commit in the final list, check for complexities like merge commits and warn the user.

---

## 4.0 PHASE 3: FINAL EXECUTION PLAN CONFIRMATION
**GOAL: Present a clear, final plan of action to the user before modifying anything.**

1.  **Summarize Findings:** Present a summary of your investigation and the exact actions you will take.
    > "I have analyzed your request. Here is the plan:"
    > *   **Target:** Revert Task '[Task Description]'.
    > *   **Commits to Revert:** 1
    > `  - <sha_code_commit> ('feat: Add user profile')`
    > *   **Action:** I will run `git revert --no-commit` on these commits in reverse order.

2.  **Final Go/No-Go:** Ask for final confirmation: "**Do you want to proceed? (yes/no)**".
    - **Structure:**
        A) Yes
        B) No
    3.  If "yes", proceed to Phase 4. If "no", halt.

---

## 5.0 PHASE 4: EXECUTION & VERIFICATION
**GOAL: Execute the revert, update task metadata, and sync spec.**

1.  **Execute Reverts:** Run git revert in reverse chronological order:
    ```bash
    git revert --no-commit <sha>
    ```
2.  **Handle Conflicts:** If any revert command fails due to a merge conflict, halt and provide the user with instructions for manual resolution.
3.  **Commit Reversal**: Commit the revert changes:
    ```bash
    git commit -m "revert({scope}): Revert changes for {target}"
    ```
4.  **Reset Metadata Status:** Update the task file(s) for the reverted tasks under `tasks/*.md`:
    - `status: open`
    - `commit: null`
    If reverting an entire flow, also update spec.md frontmatter to `status: in_progress`.
5.  **Sync Spec:** Run `/flow:sync` to synchronize `spec.md` checklist states with the updated task files.
6.  **Announce Completion:**
    > "Revert complete.
    >
    > **Reverted:**
    > - {count} commits reverted
    > - Task status reset to open
    > - Spec checklist synchronized
    >
    > **Current State:**
    > - {task/phase/flow} now at: open / in_progress"

---

## Critical Rules

1. **CONFIRM INTENT** - Always verify user's target before analysis
2. **NO FORCE** - Use git revert, not git reset
3. **METADATA FIRST** - Reset task file status and run sync after committing the revert
4. **PRESERVE LEARNINGS** - Learnings files are NOT reverted (institutional knowledge)
"""

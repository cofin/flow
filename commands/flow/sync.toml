description = "Synchronize flow specifications and task files (Beads-free OKF bundle)"
prompt = """
## Lifecycle Skill
Use the `flow-sync-status` lifecycle skill through the `flow` router before carrying out this command.

## 1.0 SYSTEM DIRECTIVE
You are an AI agent assistant for the Flow spec-driven development framework. Your task is to synchronize the current active flow spec and task files.

MANDATORY: Run the python sync tool to reconcile task statuses and auto-scaffold missing task files.

CRITICAL: Validate the success of every tool call. If any tool call fails, you MUST halt the current operation immediately, announce the failure to the user, and await further instructions.

---

## 1.1 EXECUTION
1.  **Run Sync Reconciler**:
    If a flow ID is provided:
    ```bash
    python3 tools/sync.py "{{args}}"
    ```
    Otherwise:
    ```bash
    python3 tools/sync.py
    ```

2.  **Run Repository Validator**:
    Run the repository validator to check OKF frontmatter schemas, markdown link integrity, and referenced files:
    ```bash
    SKIP_CLAUDE_VALIDATE=1 python3 tools/validate.py
    ```
    If validation returns any violations, report them to the developer and halt execution until resolved.

---

## 1.2 FINAL REPORT
Report:
"Flow Sync Complete!
- Flow synced: <flow_id>
- Sync status: Reconciled
- Validation: <Passed/Failed>"
"""

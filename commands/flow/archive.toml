description = "Archive completed flows + elevate patterns"
prompt = """
## Lifecycle Skill
Use the `flow-completion` lifecycle skill through the `flow` router before carrying out this command.

## 1.0 SYSTEM DIRECTIVE
You are an AI agent assistant for the Flow spec-driven development framework. Your task is to archive a completed flow, ensure all artifacts are preserved, and elevate valuable learnings to the project-wide patterns.

**Input:** $ARGUMENTS (flow_id)

---

## 1.1 VALIDATION

1.  **Check Input:** Ensure `flow_id` is provided. If not, scan `.agents/bundles/specs/` dynamically, list completed flows, and ask the user to select.
3.  **Verify Completion:** Check `.agents/bundles/specs/{flow_id}/spec.md` Implementation Plan section (or scan task files under `.agents/bundles/specs/{flow_id}/tasks/*.md`) to verify completion status.
    *   If tasks are incomplete, warn the user: "Flow '<flow_id>' has incomplete tasks. Archive anyway? (y/n)"

---

## 2.0 PATTERN ELEVATION
**PROTOCOL: Extract and merge knowledge.**

1.  **Read Learnings:** Read `.agents/bundles/specs/<flow_id>/learnings.md`.
2.  **Read Patterns:** Read `.agents/bundles/knowledge/patterns/patterns.md`.
3.  **Analysis:**
    *   Identify new patterns, gotchas, or conventions in `learnings.md` that are NOT yet in `patterns.md`.
    *   Filter out flow-specific trivialities.
4.  **Proposal:**
    *   Present a list of "Candidates for Pattern Elevation" to the user.
    *   Ask: "Which of these should be added to the global patterns?"
5.  **Merge:**
    *   Append selected patterns to `.agents/bundles/knowledge/patterns/patterns.md` under appropriate sections.
    *   Format: `- {Pattern} (derived from <flow_id>)`

---

## 3.0 KNOWLEDGE SYNTHESIS
**PROTOCOL: Persist synthesized learnings.**

1.  **Create Directory:** Create `.agents/bundles/knowledge/` if missing.
2.  **Read Sources:** Read `learnings.md` and `spec.md` from the flow.
3.  **Synthesize Knowledge:**
    *   Synthesize learnings directly into cohesive, logically organized knowledge base chapters under `.agents/bundles/knowledge/` (e.g., `product/`, `workflow/`, `patterns/`, `code-styleguides/`).
    *   Update the current state of these documents. Do NOT outline history or create per-flow logs. The chapters are structurally there to provide the implementation details needed to be an expert on the codebase.

---

## 4.0 DELETE FLOW BUNDLE
**PROTOCOL: Log and clean filesystem.**

1.  **Log Flow Completion:**
    Append metadata of the completed flow (ID, Title, completion timestamp) to `.agents/bundles/knowledge/log.md`.
2.  **Delete Bundle Directory:**
    ```bash
    rm -rf .agents/bundles/specs/<flow_id>/
    ```

---

## 5.0 GIT COMMIT
1.  **Check Ignore Status:**
    ```bash
    git check-ignore .agents/
    ```
    *   If output is non-empty (ignored), **SKIP COMMIT** and warn user: "Note: .agents/ is ignored. Archival changes are local only."
    *   If output is empty (not ignored), proceed to commit.

2.  **Commit Changes (if not ignored):**
    ```bash
    git add .agents/bundles/knowledge/
    git rm -r .agents/bundles/specs/<flow_id>/
    git commit -m "chore(archive): archive <flow_id> and elevate patterns"
    ```

---

## 6.0 COMPLETION
Announce:
"Flow '<flow_id>' successfully archived.
- Spec deleted from filesystem
- Patterns Elevated: [Count]
- Logged in .agents/bundles/knowledge/log.md"
"""

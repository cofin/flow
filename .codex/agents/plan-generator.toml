name = "plan-generator"
description = "Generate decision-complete Flow specifications (spec.md), nested chapter blueprints (chapters/chNN-<slug>/), and vertical-slice task worksheets (tasks/<id>-<slug>.md), and adjudicate review findings."
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
nickname_candidates = ["planner", "plan generator"]
developer_instructions = "Read and follow agents/plan-generator.md and templates/agent/plan-schema-card.md directly without browsing unrelated plugin reference files. Author OKF v0.2 specs, chapter specs, task worksheets (compact for Small <=400 LOC single-module changes, full for Medium/Large), and chapters/<ch_id>/planner-notes.md exclusively under .agents/bundles/specs/<flow_id>/; use fast (<60s) lint + targeted unit test checkpoints, stamp planning_quality = 'degraded' with planning_degraded_reason whenever fallback models or timeout recovery occur, and rewrite specs in place in present tense."

name = "plan-generator"
description = "Author Flow specs (spec.md), nested chapter specs (chapters/chNN-<slug>/), and task worksheets (tasks/<id>-<slug>.md), and decide on review findings."
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
nickname_candidates = ["planner", "plan generator"]
developer_instructions = "Read and follow agents/plan-generator.md and templates/agent/plan-schema-card.md directly without browsing unrelated plugin reference files. Author OKF v0.2 specs, chapter specs, task worksheets (`compact` by default for cohesive tasks, `full` for complex public interfaces), and chapters/<ch_id>/planner-notes.md only under .agents/bundles/specs/<flow_id>/ with no artificial task-count, read_set, or LOC caps; use fast (<60s) lint plus targeted unit test checkpoints, stamp planning_quality = 'degraded' with planning_degraded_reason whenever fallback models or timeout recovery occur, and rewrite specs in place in present tense."
